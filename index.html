<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Souvenir Camera</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
        body, html { width:100%; height:100%; overflow:hidden; background:#000; font-family:sans-serif; }
        #camera-container { position:relative; width:100%; height:100%; display:flex; justify-content:center; align-items:center; overflow:hidden; }
        video { width:100%; height:100%; object-fit:cover; }
        .mirror { transform:scaleX(-1); }
        
        #frame-overlay { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; object-fit:cover; z-index:5; display:none; }
        
        #capture-btn { position:absolute; bottom:30px; left:50%; transform:translateX(-50%); width:75px; height:75px; background:white; border:5px solid rgba(0,0,0,0.3); border-radius:50%; cursor:pointer; z-index:10; }
        #switch-btn { position:absolute; bottom:42px; right:30px; width:50px; height:50px; background:rgba(0,0,0,0.5); border:2px solid white; border-radius:50%; color:white; font-size:24px; cursor:pointer; z-index:10; display:flex; justify-content:center; align-items:center; }
        #canvas { display:none; }
        
        #loading-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:200; display:flex; flex-direction:column; justify-content:center; align-items:center; color:white; font-family:sans-serif; text-align:center; padding: 20px; }
        #loading-frame-preview { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; pointer-events:none; opacity:0.4; z-index:1; }
        
        .loading-box { z-index:2; display:flex; flex-direction:column; align-items:center; background: rgba(0,0,0,0.6); padding: 25px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); }
        .spinner { border:4px solid rgba(255,255,255,0.1); width:45px; height:45px; border-radius:50%; border-left-color:#fff; animation:spin 1s linear infinite; margin-bottom:20px; }
        .loading-title { font-size: 20px; font-weight: bold; margin-bottom: 8px; color: #fff; letter-spacing: 0.5px; }
        .loading-sub { font-size: 14px; color: #ccc; max-width: 250px; line-height: 1.4; }
        @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }

        /* iOS Popup fix styling */
        #ios-save-popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 500; justify-content: center; align-items: center; flex-direction: column; color: white; padding: 20px; }
        #ios-image-preview { max-width: 80%; max-height: 60%; border: 3px solid white; border-radius: 10px; margin-bottom: 20px; }
        .close-popup-btn { padding: 10px 20px; background: white; color: black; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="camera-container">
    <video id="webcam" class="mirror" autoplay playsinline></video>
    <img id="frame-overlay" alt="Branding Overlay">
    <button id="capture-btn" onclick="capturePhoto()"></button>
    <button id="switch-btn" onclick="switchCamera()">🔄</button>
</div>

<div id="loading-overlay">
    <img id="loading-frame-preview" alt="Loading Preview">
    <div class="loading-box">
        <div class="spinner"></div>
        <div class="loading-title">Allow Camera Access 📸</div>
        <div id="loading-text" class="loading-sub">Mangyaring pindutin ang <b>"Allow"</b> kapag nag-prompt ang iyong browser para magamit ang Souvenir Camera. ✨</div>
    </div>
</div>

<!-- iOS Cross-Platform Compatibility Layer Screen Container Toggle Element -->
<div id="ios-save-popup">
    <h3 style="margin-bottom: 10px;">Long Press image to Save!</h3>
    <p style="font-size:14px; color:#ccc; margin-bottom:15px; text-align:center;">Di-diinan ang larawan at piliin ang "Save to Photos" o "Download".</p>
    <img id="ios-image-preview" alt="Captured Photo Preview">
    <button class="close-popup-btn" onclick="closePreview()">Close / Take Another</button>
</div>

<img id="frame-source" style="display:none;">
<canvas id="canvas"></canvas>

<script>
    // 🔒 SECURITY LAYER 1: DOMAIN PROTECTION
    (function(){
        const allowedHost = "scantoselfie.github.io"; 
        const currentHost = window.location.hostname;
        if (!currentHost.includes(allowedHost) && !currentHost.includes("localhost") && !currentHost.includes("127.0.0.1")) {
            document.body.innerHTML = "<div style='color:white;text-align:center;padding-top:50px;font-family:sans-serif;'><h2>🚫 Unauthorized Domain</h2><p>This software is protected and locked.</p></div>";
            throw new Error("Execution halted.");
        }
    })();

    // Anti-DevTools Key Blocker
    document.addEventListener('keydown', function(e) {
        if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && e.keyCode == 85)) {
            e.preventDefault();
            return false;
        }
    });
    
    const videoElement = document.getElementById('webcam');
    const captureCanvas = document.getElementById('canvas');
    const loadingOverlay = document.getElementById('loading-overlay');
    const frameOverlay = document.getElementById('frame-overlay');
    const frameSourceImage = document.getElementById('frame-source');
    const loadingFramePreview = document.getElementById('loading-frame-preview');
    
    let activeStream = null;
    let cameraFacingMode = "user";
    let encodedFrameTarget = "ZnJhbWUucG5n"; // "frame.png"

    function initCamera() {
        const unmaskedSrc = atob(encodedFrameTarget);
        loadingFramePreview.src = unmaskedSrc;
        
        frameOverlay.onload = function() { frameOverlay.style.display = "block"; };
        frameOverlay.src = unmaskedSrc;
        frameSourceImage.src = unmaskedSrc;
        
        startCameraStream(cameraFacingMode);
    }

    function startCameraStream(facingModeSetting) {
        if (activeStream) {
            activeStream.getTracks().forEach(track => track.stop());
        }
        
        if (facingModeSetting === "user") {
            videoElement.classList.add('mirror');
        } else {
            videoElement.classList.remove('mirror');
        }
        
        navigator.mediaDevices.getUserMedia({
            video: { facingMode: facingModeSetting, width: { ideal: 1920 }, height: { ideal: 1080 } },
            audio: false
        })
        .then(stream => { 
            activeStream = stream; 
            videoElement.srcObject = stream; 
            loadingOverlay.style.display = "none"; 
        })
        .catch(err => { 
            document.getElementById('loading-text').innerHTML = "<span style='color:#ff4d4d;'>Inyong pinigilan (Blocked) ang camera access. Paki-refresh ang page at piliin ang Allow.</span>";
        });
    }

    function switchCamera() { 
        cameraFacingMode = (cameraFacingMode === "user") ? "environment" : "user"; 
        startCameraStream(cameraFacingMode); 
    }
    
    async function capturePhoto() {
        const context = captureCanvas.getContext('2d');
        const targetWidth = 1080;
        const targetHeight = 1920;
        
        captureCanvas.width = targetWidth;
        captureCanvas.height = targetHeight;
        
        const videoWidth = videoElement.videoWidth;
        const videoHeight = videoElement.videoHeight;
        const videoAspect = videoWidth / videoHeight;
        const targetAspect = targetWidth / targetHeight;
        
        let sourceX = 0, sourceY = 0, sourceWidth = videoWidth, sourceHeight = videoHeight;
        
        if (videoAspect > targetAspect) {
            sourceWidth = videoHeight * targetAspect;
            sourceX = (videoWidth - sourceWidth) / 2;
        } else {
            sourceHeight = videoWidth / targetAspect;
            sourceY = (videoHeight - sourceHeight) / 2;
        }
        
        context.save();
        if (cameraFacingMode === "user") {
            context.translate(captureCanvas.width, 0);
            context.scale(-1, 1);
        }
        
        context.drawImage(videoElement, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, captureCanvas.width, captureCanvas.height);
        context.restore();
        
        try { 
            context.drawImage(frameSourceImage, 0, 0, targetWidth, targetHeight); 
        } catch(e) {
            console.error("Frame failed to draw onto canvas context target", e);
        }
        
        const imageDataUrl = captureCanvas.toDataURL('image/png');
        
        // Detection routine checking platform rules for iOS Safari execution handling
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        
        if (isIOS) {
            document.getElementById('ios-image-preview').src = imageDataUrl;
            document.getElementById('ios-save-popup').style.display = 'flex';
        } else {
            const downloadLink = document.createElement('a');
            downloadLink.download = `souvenir-${Math.floor(Date.now()/1000)}.png`;
            downloadLink.href = imageDataUrl;
            downloadLink.click();
        }
    }

    function closePreview() {
        document.getElementById('ios-save-popup').style.display = 'none';
    }

    // Run Initialization Loop
    initCamera();
</script>
</body>
</html>
